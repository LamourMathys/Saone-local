name: CI

on: [push, pull_request]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Vérifier le README
        run: test -f readme.md

      - name: Vérifier les .txt
        run: find ./weeklys -name "*.txt" | grep .

      - name: Vérifier si il y a des fichiers dans le dossier "Livrables"
        run: find ./Livrables -type f | grep .

  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: check-files
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push
        run: |
          docker build -t ghcr.io/lamourmathys/saone-local:latest .
          docker push ghcr.io/lamourmathys/saone-local:latest

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSHKEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ghcr.io/lamourmathys/saone-local:latest
            sudo docker stop saone-local || true
            sudo docker rm saone-local || true
            sudo docker run -d \
              --name saone-local \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              ghcr.io/lamourmathys/saone-local:latest
