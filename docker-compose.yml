services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saone
      POSTGRES_PASSWORD: saone
      POSTGRES_DB: saone
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    image: ghcr.io/lamourmathys/saone-local:api
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      - db

  app:
    image: ghcr.io/lamourmathys/saone-local:app
    ports:
      - "3001:3001"
    environment:
      - API_URL=http://api:3000
      - PORT=3001
    depends_on:
      - api

volumes:
  postgres_data:
