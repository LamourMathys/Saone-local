server {
    listen 80;
    server_name saone-local.webhop.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name saone-local.webhop.me;

    ssl_certificate /etc/letsencrypt/live/saone-local.webhop.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saone-local.webhop.me/privkey.pem;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}